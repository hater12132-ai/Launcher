name: Build APK

on:
  workflow_dispatch:   # run manually from GitHub UI
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download arm64 native libs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # TODO: put a real URL below (Release asset, Drive, etc.)
          # Example if you upload split_config.arm64_v8a.apk to a GitHub Release:
          # curl -L -o /tmp/arm64.apk "https://github.com/YOU/REPO/releases/download/libs/split_config.arm64_v8a.apk"
          # unzip -j /tmp/arm64.apk "lib/arm64-v8a/*" -d app/src/main/jniLibs/arm64-v8a/
          echo "Add your libs download URL here"
          ls -lh app/src/main/jniLibs/arm64-v8a/ || true

      - name: Grant gradlew execute
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
